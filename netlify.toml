# Konfigurasi Netlify (juga dipakai Netlify CLI & drag-and-drop)
# Build: npm run build   |   Publish: dist

[build]
  command = "npm run build"
  publish = "dist"

# Aset ber-hash boleh di-cache lama; index.html selalu dicek ulang.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Halaman cerita yang dipublikasikan (.html) ikut dilayani.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
